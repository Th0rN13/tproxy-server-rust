name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-musl
      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Package
        run: |
          set -euo pipefail
          name="tproxy-server-x86_64-unknown-linux-musl"
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/tproxy-server dist/
          tar -C dist -czf "dist/$name.tar.gz" tproxy-server
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          file dist/tproxy-server
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" dist/*.tar.gz dist/*.sha256 --clobber
